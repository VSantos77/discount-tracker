name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow-dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
        # Install uv with cache enabled for faster repeated runs
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
            enable-cache: true

      - name: Install deps
        run: uv sync --dev

      - name: Test spiders
        run: uv run pytest tests/spiders/ -v