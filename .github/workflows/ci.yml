name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
        # Install uv with cache enabled for faster repeated runs
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
            enable-cache: true

      - name: Install deps
        run: uv sync --dev --group scrapy

      # Runs test on each spider with limited item count
      - name: Test spiders
        run: uv run pytest tests/spiders/ -v

deploy:
    needs: test
    # Runs only on push to main. Prevent deploys on PR
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        # Double tag to update latest and keep traceability
        run: |
          docker build \
            -t vsantos77/discount-tracker-scrapy:latest \
            -t vsantos77/discount-tracker-scrapy:${{ github.sha }} \
            .
          docker push vsantos77/discount-tracker-scrapy:latest
          docker push vsantos77/discount-tracker-scrapy:${{ github.sha }}

      - name: Auth on GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update scrapy job image reference
        run: |
          gcloud run jobs update discount-tracker-scrapy-job \
            --image docker.io/vsantos77/discount-tracker-scrapy:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }}