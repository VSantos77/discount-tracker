# .github/workflows/ci-dbt.yml
name: CI dbt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      dbt: ${{ steps.filter.outputs.dbt_test }}
      dbt_deploy: ${{ steps.filter.outputs.dbt_deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            dbt_test:
              - 'discount_tracker_dbt/**'
              - 'pyproject.toml'
              - 'uv.lock'
            dbt_deploy:
              - 'discount_tracker_dbt/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'

  test:
    needs: changes
    if: needs.changes.outputs.dbt_test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: discount_tracker_dbt
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --dev --group dbt

      - name: Auth on GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
            credentials_json: ${{ secrets.GCP_DBT_SA_KEY }}

      - name: dbt build against ci target
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          DBT_KEYFILE_PATH: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          uv run dbt deps
          uv run dbt build --target ci

  deploy:
    needs: [changes,test]
    if: |
        github.ref == 'refs/heads/main' && 
        github.event_name == 'push' &&
        ${{ needs.changes.outputs.dbt_deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        # Double tag to update latest and keep traceability
        run: |
          docker build \
            --target dbt \
            -t vsantos77/discount-tracker-dbt:latest \
            -t vsantos77/discount-tracker-dbt:${{ github.sha }} \
            .
          docker push vsantos77/discount-tracker-dbt:latest
          docker push vsantos77/discount-tracker-dbt:${{ github.sha }}

      - name: Auth on GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update dbt job image reference
        # Update dbt cloud run job to point to the recently pushed Docker image
        run: |
          gcloud run jobs update discount-tracker-dbt-job \
            --image docker.io/vsantos77/discount-tracker-dbt:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }}