services:
  db:
    image: postgres:16-alpine
    container_name: discount_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d/

  pgadmin:
    image: dpage/pgadmin4
    container_name: discount_pgadmin
    restart: always
    environment:
      # These are the credentials you'll use to LOG IN to pgAdmin in your browser
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - db

  orchestrator:
    image: discount-tracker-orchestrator:1.0
    build: .
    container_name: discount_orchestrator
    depends_on:
      - db
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB_PORT=${POSTGRES_DB_PORT}
    volumes:  
      - .:/app
      - /app/.venv # Avoid volume conflicts with the virtual environment
    command: /bin/bash

volumes:
  postgres_data: