name: 'discount_tracker_dbt'
version: '1.0.0'
config-version: 2

# This name is the link to your profiles.yml
profile: 'discount-tracker-bq' 

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

models:
    discount_tracker_dbt:
        staging:
            +materialized: view
            +dataset: dbt_staged
        intermediate:
            +materialized: view
            +dataset: dbt_staged
        analytics:
            +materialized: table
            +dataset: dbt_analytics
seeds:
    discount_tracker_dbt:
        +dataset: dbt_seeds

data_tests:
    discount_tracker_dbt:
        source_tests:
            +warn_if: '>= 1'
            +error_if: '>= 10'

# Set each entity's raw json keys that will be source tested
# Scrapy test reads from here.
vars:
    galicia:
        - source_id
        - tipoPromocion
        - categoria
        - marca
        - fechaDesde
        - fechaHasta
        - porcentajeAhorro
        - descripcionAdicional
        - legales
        - topeReintegro
        - minimoCompra
        - cuotaSinInteresHasta
        - diasAplicacion
        - tiendaOnline
        - tiendaFisica
        - leyendaCompra
        - mediosDePago
    naranjax:
        - id
        - commerceName
        - benefitName
        - days
        - benefit
        - promotionDetails
        - days.weekdaysApplied
        - paymentMethods
    bbva:
        - source_id 
        - cabecera 
        - canalesVenta 
        - beneficios 
        - diasPromo 
        - basesCondiciones 
        - subcabecera
        - grupoTarjeta