discount_tracker:
  target: dev_local
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('DB_HOST') }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      port: "{{ env_var('POSTGRES_DB_PORT') | as_number }}"
      dbname: "{{ env_var('DB_NAME') }}"
      schema: dbt_prod
    dev_local:
      type: postgres
      host: localhost
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      port: "{{ env_var('POSTGRES_DB_PORT') | as_number }}"
      dbname: "{{ env_var('DB_NAME') }}"
      schema: dbt_dev
      threads: 1
    dev_docker:
      type: postgres
      host: "{{ env_var('DB_HOST') }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      port: "{{ env_var('POSTGRES_DB_PORT') | as_number }}"
      dbname: "{{ env_var('DB_NAME') }}"
      schema: dbt_dev
      threads: 1
