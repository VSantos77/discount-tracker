version: 2

models:
    - name: int_joined_deduped_and_normalized_discounts
      description: >
        "This model handles the union of the different sources,
        dedups based on surrogate key based on source id + issuer
        (since the same discount can be scraped multiple times over)
        and normalizes fields / applies business logic for downstream
        consumption."
      data_tests:
      # Ensure discount end date is at least the same as start_date
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: discount_end_date
            column_B: discount_start_date
            or_equal: True
      columns:
        - name: discount_id
          data_tests:
            - unique
            - not_null
        - name: discount_start_date
          data_tests:
            - not_null
        - name: discount_end_date
          data_tests:
            - not_null
        - name: discount_rate
          data_tests:
            - not_null
            - dbt_expectations.expect_column_values_to_be_between:
                arguments:
                    min_value: 0
                    max_value: 1
        - name: discount_no_interest_installment_qty
          data_tests:
            - not_null
            - dbt_expectations.expect_column_values_to_be_between:
                arguments:
                    min_value: 0
        - name: discount_name
        - name: discount_description
        - name: discount_url
        - name: discount_terms_and_conditions
        - name: discount_max_discount_amount
          data_tests:
            - dbt_expectations.expect_column_values_to_be_between:
                arguments:
                    min_value: 0
        - name: discount_min_purchase_amount
          data_tests:
            - dbt_expectations.expect_column_values_to_be_between:
                arguments:
                    min_value: 0
        - name: discount_valid_days_list
          data_tests:
            - not_null
        - name: discount_valid_online
          data_tests:
            - not_null
        - name: discount_valid_instore
          data_tests:
            - not_null
        - name: discount_metadata
        - name: last_updated_at_date
          data_tests:
            - not_null
    - name: int_business_dedup_audit
      description: >
        "Model that generates surrogate key based on key discount fields.
        Some issuers will send the same discount multiple times over
        (with different ids).

        Keeping all duplicates for auditing."
    - name: int_business_deduped_discounts
      description: > 
        "Takes int_business_dedup_audit but keeps only the first record
        effectively deduplicating for downstream consumption."
      columns:
        - name: discount_business_id
          data_tests:
            - unique
            - not_null
