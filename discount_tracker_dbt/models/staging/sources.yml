version: 2

sources:
  - name: staging
    description: "Raw discount data scraped from issuers websites"
    dataset: raw_source
    tables:
      - name: raw_discounts
        description: "Raw JSONB landing table — one row per scraped item, untransformed"
        columns:
          - name: spider
            description: "Name of the spider that scraped this item (hive partition column)"
          - name: scraped_at_dt
            description: "Date when the item was scraped (hive partition column, derived from GCS path)"
          - name: raw_payload
            description: "The full raw payload as scraped, stored as JSON for flexibility"