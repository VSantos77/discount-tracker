version: 2

models:
  - name: fct_discounts
    description: "Fact table for discounts, containing aggregated discount data for analysis"
    tests:
      # Ensure discount end date is at least the same as start_date
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          column_A: discount_end_date
          column_B: discount_start_date
          or_equal: True
    columns:
      - name: discount_id
        data_tests:
          - not_null
          - unique        
      - name: issuer_id
        data_tests:
          - not_null
      - name: merchant_id
        data_tests:
          - not_null
      - name: discount_start_date
        data_tests:
          - not_null
      - name: discount_end_date
        data_tests:
          - not_null
      - name: discount_rate
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: discount_no_interest_installment_qty
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: discount_name
      - name: discount_description
      - name: discount_url
      - name: discount_terms_and_conditions
      - name: discount_max_discount_amount
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: discount_min_purchase_amount
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: discount_valid_days_list
        data_tests:
          - not_null
      - name: discount_valid_online
        data_tests:
          - not_null
      - name: discount_valid_instore
        data_tests:
          - not_null
      - name: discount_metadata
      - name: scraped_at_dt
  - name: dim_merchants
    description: "Dimension table for merchants containing information about the merchants offering discounts"
    columns:
      - name: merchant_id
        data_tests:
          - not_null
          - unique
      - name: merchant_name
        data_tests:
          - not_null
      - name: merchant_category_name
        data_tests:
          - not_null
  - name: dim_issuers
    description: "Dimension table for issuers, containing information about the issuers offering discounts"
    columns:
      - name: issuer_id
        data_tests:
          - not_null
          - unique
      - name: issuer_name
  - name: issuer_metadata
    description: "Active issuer metadata for Streamlit: issuer name, last scrape timestamp, and discount counts"
    columns:
      - name: issuer_name
        data_tests:
          - not_null
          - unique
      - name: last_scraped_at
        data_tests:
          - not_null
      - name: discount_count
        data_tests:
          - not_null
