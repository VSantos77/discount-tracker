version: 2

models:
  - name: fct_discounts
    description: "Fact table for discounts, containing aggregated discount data for analysis"
    columns:
      - name: discount_id
        data_tests:
          - not_null
          - unique        
      - name: issuer_id
        data_tests:
          - not_null
      - name: merchant_id
        data_tests:
          - not_null
      - name: discount_start_date
        data_tests:
          - not_null
      - name: discount_end_date
        data_tests:
          - not_null
      - name: discount_rate
        data_tests:
          - not_null
      - name: discount_no_interest_installment_qty
        data_tests:
          - not_null
      - name: discount_valid_days_list
        data_tests:
          - not_null
      - name: discount_valid_online
        data_tests:
          - not_null
      - name: discount_valid_instore
        data_tests:
          - not_null
  - name: dim_merchants
    description: "Dimension table for merchants containing information about the merchants offering discounts"
    columns:
      - name: merchant_id
        data_tests:
          - not_null
          - unique
  - name: dim_issuers
    description: "Dimension table for issuers, containing information about the issuers offering discounts"
    columns:
      - name: issuer_id
        data_tests:
          - not_null
          - unique
