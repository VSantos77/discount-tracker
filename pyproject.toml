[project]
name = "discount-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datetime>=6.0",
    "dbt-bigquery>=1.11.1",
    "dbt-core>=1.11.8",
    "dbt[bigquery]>=1.0.0.40.15",
    "dotenv>=0.9.9",
    "google-cloud-storage>=2.0",
    "neon-api>=0.3.0",
    "plotly>=6.6.0",
    "regex>=2026.1.15",
]

[dependency-groups]
orchestrator = [
    "dbt>=1.0.0.40.14",
    "dbt-core>=1.11.6",
    "dbt-postgres>=1.10.0",
    "prefect>=3",
    "prefect[shell]>=3.6.26",
    "scrapy>=2.14.1",
]
streamlit = [
    "streamlit>=1.55.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils", "discount_tracker_streamlit"]
